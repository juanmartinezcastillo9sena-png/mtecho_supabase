<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTecho – Acceso</title>
  <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <h1>MTecho</h1>
    <p>Gestión de arriendo de apartamentos</p>
    <p class="tabs">
      <a href="#" id="tab-login" class="active">Iniciar sesión</a> |
      <a href="#" id="tab-register">Registrarse</a>
    </p>

    <div id="mensaje" class="alert" hidden></div>

    <form id="form-login">
      <label for="login-email">Correo</label>
      <input type="email" id="login-email" required>
      <label for="login-password">Contraseña</label>
      <input type="password" id="login-password" required>
      <button type="submit">Entrar</button>
    </form>

    <form id="form-register" hidden>
      <label for="reg-nombre">Nombre (opcional)</label>
      <input type="text" id="reg-nombre">
      <label for="reg-email">Correo</label>
      <input type="email" id="reg-email" required>
      <label for="reg-password">Contraseña</label>
      <input type="password" id="reg-password" required>
      <label for="reg-confirm">Confirmar contraseña</label>
      <input type="password" id="reg-confirm" required>
      <button type="submit">Crear cuenta</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../../config/config.js"></script>
  <script src="../../models/supabaseClient.js"></script>
  <script src="../../models/authModel.js"></script>
  <script src="../../controllers/authController.js"></script>
</body>
</html>
